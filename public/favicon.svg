<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="#ffffff"/>
  <circle cx="90" cy="90" r="85" fill="url(#grad)"/>
  <!-- Handshake shape -->
  <g transform="translate(90, 90)" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hand -->
    <path d="M -35,-15 Q -45,-5 -40,10 Q -35,20 -20,18"/>
    <!-- Right hand -->
    <path d="M 35,-15 Q 45,-5 40,10 Q 35,20 20,18"/>
    <!-- Connection in middle -->
    <path d="M -20,18 Q 0,25 20,18"/>
  </g>
</svg>