# Firebase App Hosting configuration.
#
# Use this if you deploy with App Hosting (the managed Next.js runtime) instead
# of the Hosting web-frameworks integration. Both are supported — see
# docs/DEPLOYMENT.md for the trade-offs.
#
# App Hosting injects Application Default Credentials automatically, so the
# Admin SDK needs no service-account secret in production.
#
# IMPORTANT: every entry under `env` must carry a non-empty `value:` or a
# `secret:`. An empty string (`value: ""`) fails the build with
# "either 'value' or 'secret' field is required" — so unset variables are
# commented out below rather than left blank.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---- Public Firebase config -------------------------------------------
  # These are public identifiers, not secrets — safe as plain values. Access
  # is gated by firestore.rules / storage.rules, not by hiding them.
  # Source: Firebase console → Project settings → General → Your apps → Web app.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDEzN9-V67SLBkGV8CQohSJ1FgiCMcHi8k"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "greenpass-4ebc7.firebaseapp.com"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "greenpass-4ebc7"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "greenpass-4ebc7.firebasestorage.app"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1070428306057"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1070428306057:web:c5f35e9d1258690c076458"
    availability: [BUILD, RUNTIME]

  # ---- Site ---------------------------------------------------------------
  # The canonical origin — drives canonical URLs, Open Graph tags, sitemap.xml
  # and robots.txt. Swap this for the App Hosting domain shown in the console
  # (Hosting & Serverless → App Hosting → your backend), or the custom domain
  # once one is attached. No trailing slash.
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://greenpass-4ebc7.web.app"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_ALLOW_INDEXING
    value: "true"
    availability: [BUILD, RUNTIME]

  # ---- reCAPTCHA ----------------------------------------------------------
  # Create a v3 site at https://www.google.com/recaptcha/admin, then uncomment.
  # - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
  #   value: "6Lc..."
  #   availability: [BUILD, RUNTIME]

  # Secrets live in Secret Manager. Create it first — a `secret:` reference to
  # a secret that does not exist fails the rollout:
  #   firebase apphosting:secrets:set RECAPTCHA_SECRET_KEY
  # Then uncomment. Until then the contact form skips verification and logs a
  # warning (see src/app/api — RECAPTCHA_SECRET_KEY unset ⇒ verification off).
  # - variable: RECAPTCHA_SECRET_KEY
  #   secret: RECAPTCHA_SECRET_KEY
  #   availability: [RUNTIME]
