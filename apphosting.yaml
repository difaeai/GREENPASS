# Firebase App Hosting configuration.
#
# Use this if you deploy with App Hosting (the managed Next.js runtime) instead
# of the Hosting web-frameworks integration. Both are supported — see
# docs/DEPLOYMENT.md for the trade-offs.
#
# App Hosting injects Application Default Credentials automatically, so the
# Admin SDK needs no service-account secret in production.
#
# IMPORTANT: every entry under `env` must carry a non-empty `value:` or a
# `secret:`. An empty string (`value: ""`) fails the build with
# "either 'value' or 'secret' field is required" — so unset variables are
# commented out below rather than left blank.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---- Public Firebase config -------------------------------------------
  # These are public identifiers, not secrets — safe as plain values.
  # Firebase console → Project settings → General → Your apps → Web app.
  # Uncomment each line and paste the real value; the browser SDK (admin
  # login, dashboard writes) stays disabled until all six are present.
  #
  # - variable: NEXT_PUBLIC_FIREBASE_API_KEY
  #   value: "AIza..."
  #   availability: [BUILD, RUNTIME]
  #
  # - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  #   value: "your-project.firebaseapp.com"
  #   availability: [BUILD, RUNTIME]
  #
  # - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  #   value: "your-project"
  #   availability: [BUILD, RUNTIME]
  #
  # - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  #   value: "your-project.firebasestorage.app"
  #   availability: [BUILD, RUNTIME]
  #
  # - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  #   value: "000000000000"
  #   availability: [BUILD, RUNTIME]
  #
  # - variable: NEXT_PUBLIC_FIREBASE_APP_ID
  #   value: "1:000000000000:web:abc123"
  #   availability: [BUILD, RUNTIME]

  # ---- Site ---------------------------------------------------------------
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://your-project.web.app"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_ALLOW_INDEXING
    value: "true"
    availability: [BUILD, RUNTIME]

  # ---- reCAPTCHA ----------------------------------------------------------
  # Create a v3 site at https://www.google.com/recaptcha/admin, then uncomment.
  # - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
  #   value: "6Lc..."
  #   availability: [BUILD, RUNTIME]

  # Secrets live in Secret Manager. Create it first — a `secret:` reference to
  # a secret that does not exist fails the rollout:
  #   firebase apphosting:secrets:set RECAPTCHA_SECRET_KEY
  # Then uncomment. Until then the contact form skips verification and logs a
  # warning (see src/app/api — RECAPTCHA_SECRET_KEY unset ⇒ verification off).
  # - variable: RECAPTCHA_SECRET_KEY
  #   secret: RECAPTCHA_SECRET_KEY
  #   availability: [RUNTIME]
